Edition: 3.0.0
Type: Project
Name: start-nest-cap
Version: 0.0.4
Provider:
  - 阿里云
Description: 本案例展示了如何将 Nest.js，一款灵活的 Node.js 框架，快速创建并部署到云原生应用开发平台 CAP。Nest.js 使用 TypeScript 作为主要语言，提供了严格的类型检查，采用模块化和面向切面编程的概念，使得代码组织结构清晰且易于测试。
HomePage: https://github.com/devsapp/start-web-framework/tree/dipper/web-framework/nodejs/nest
Organization: 阿里云函数计算（FC）
Effective: Public
Tags:
  - nest
  - 云应用
  - Custom Runtime
Category: 基础云服务
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  日志服务: 
    Authorities: 
      - AliyunFCServerlessDevsRolePolicy
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-qingdao
        - cn-zhangjiakou
        - cn-huhehaote
        - cn-shenzhen
        - cn-chengdu
        - cn-hongkong
        - ap-southeast-1
        - ap-southeast-2
        - ap-southeast-3
        - ap-southeast-5
        - ap-northeast-1
        - eu-central-1
        - eu-west-1
        - us-west-1
        - us-east-1
        - ap-south-1
    functionName:
      title: 函数名
      type: string
      default: start-nest-${default-suffix}
      description: 函数名称，只能包含字母、数字、下划线和中划线。不能以数字、中划线开头。长度在 1-64 之间
