edition: 3.0.0
name: springboot-app
access: "{{ access }}"
vars:
  region: "{{ region }}"
  path: '/opt/java17/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin'
  javaHome: '/opt/java17'
  javaLayers: 'acs:fc:${vars.region}:official:layers/Java17/versions/2'

resources:
  start_springboot:
    component: fc3
    actions:
      pre-deploy:
        - run: mvn package -DskipTests
          path: ./
    props:
      region: ${vars.region}
      description: springboot function
      runtime: custom
      cpu: 1
      memorySize: 2048
      diskSize: 512
      instanceConcurrency: 100
      environmentVariables:
        PATH: ${vars.path}
        JAVA_HOME: ${vars.javaHome}
      layers:
        - ${vars.javaLayers}
      customRuntimeConfig:
        command:
          - java
        args:
          - -Dserver.port=9000
          - -jar
          - webframework.jar
      functionName: "{{ functionName }}"
      code: ./target/
      role: "{{ roleArn }}"
      logConfig: auto
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
      customDomain:
        domainName: auto
        protocol: HTTP
        route:
          path: /*
          qualifier: LATEST
