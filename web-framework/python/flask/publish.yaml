Edition: 3.0.0
Type: Project
Name: start-flask-cap
Provider:
  - 阿里云
Version: 0.0.4
Description: 本案例展示了如何将 Flask，一款非常受欢迎的 Web 框架，快捷创建并部署到云原生应用开发平台 CAP。Flask 以其轻量级、简洁性和易用性著称，特别适用于小型、简单的 Web 应用或 API 开发。
HomePage: https://github.com/devsapp/start-web-framework/tree/dipper/web-framework/python/flask
Organization: 阿里云函数计算（FC）
Effective: Public
Tags:
  - Web框架
  - Flask
Category: Web框架
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  日志服务: 
    Authorities: 
      - AliyunFCServerlessDevsRolePolicy
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-qingdao
        - cn-zhangjiakou
        - cn-huhehaote
        - cn-shenzhen
        - cn-chengdu
        - cn-hongkong
        - ap-southeast-1
        - ap-southeast-2
        - ap-southeast-3
        - ap-southeast-5
        - ap-northeast-1
        - ap-northeast-2
        - eu-central-1
        - eu-west-1
        - us-west-1
        - us-east-1
        - ap-south-1
    functionName:
      title: 函数名
      type: string
      default: flask-${default-suffix}
      pattern: "^[a-zA-Z_][a-zA-Z0-9-_]{0,127}$"
      description: 函数名称，只能包含字母、数字、下划线和中划线。不能以数字、中划线开头。长度在 1-128 之间
