edition: 3.0.0
name: start-flask-app
access: "{{ access }}"
vars:
  region: "{{ region }}"

resources:
  start_flask:
    component: fc3
    actions:
      pre-deploy:
        - run: mkdir -p python
          path: ./
        - run: export PATH=/usr/local/envs/py310/bin:$PATH && pip install -r requirements.txt -t ./python
          path: ./
    props:
      timeout: 60
      cpu: 1
      memorySize: 2048
      diskSize: 512
      instanceConcurrency: 100
      region: ${vars.region}
      description: flask function
      runtime: custom.debian10
      customRuntimeConfig:
        command:
          - python3
          - index.py
        port: 9000
      environmentVariables:
        PATH: /var/fc/lang/python3.10/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin
        PYTHONPATH: /opt/python:/code/python:/code
        TZ: Asia/Shanghai
      functionName: "{{ functionName }}"
      code: ./
      logConfig: auto
      role: "{{ roleArn }}"
      layers:
        - acs:fc:${this.props.region}:official:layers/Python3-Flask2x/versions/2
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
      customDomain:
        domainName: auto
        protocol: HTTP
        route:
          path: /*
          qualifier: LATEST
